# Fichier de configuration Alembic

[alembic]
# Chemin vers le dossier contenant vos migrations
script_location = alembic

# Chemin vers les métadonnées de vos modèles SQLAlchemy
# Nous allons surcharger cela dans env.py
prepend_sys_path = .

# Version du format de migration
version_path_separator = os

# Utilisation de la variable d'environnement pour l'URL de la DB
# On va laisser vide pour la définir dynamiquement dans env.py
sqlalchemy.url = postgresql://admin:secret@localhost:5432/breast_cancer_db

[post_write_hooks]
hooks = black
black.type = console_scripts
black.entrypoint = black
black.options = -l 120

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S